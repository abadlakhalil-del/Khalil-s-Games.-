function renderGrid(){let list=getList();$("#statGames").textContent=GAMES.length;$("#title").textContent=(state.view==="fav"?t("myFavs"):t("allGames"))+` (${list.length})`;$("#grid").innerHTML=list.length?list.map(g=>`<article class="card" data-id="${g.id}"><div class="thumb" style="background:${grad(g.c)}">${g.emoji}<span class="badge">${catName(g.cat)}</span><button class="fav ${favs.has(g.id)?"on":""}" data-fav="${g.id}">${favs.has(g.id)?"❤":"♡"}</button></div><div class="info"><h3>${esc(L(g.name))}</h3><div class="meta"><span>★ ${g.rating}</span><span>⬇ ${fmtDl(g.dl)}</span><span>${fmtSize(g.size)}</span></div><div class="plats">${g.plats.map(p=>`<span title="${PLATFORMS[p].label}">${PLATFORMS[p].icon}</span>`).join("")}</div>${g.play?`<button class="play-btn" data-play="${g.id}">▶ ${t("playNow")}</button>`:""}<div class="dl-mini">${t("download")}</div></div></article>`).join(""):`<div class="empty">${t("noResults")}</div>`}
function openGame(id){let g=GAMES.find(x=>x.id===id);if(!g)return;let dl=g.plats.map(p=>`<button class="dl-btn" data-dl="${g.id}:${p}"><span>${PLATFORMS[p].icon}</span><span>${esc(L(g.name))} — ${PLATFORMS[p].label}<small>${PLATFORMS[p].ext} · v${g.ver} · ${fmtSize(g.size)}</small></span><span class="go">${t("download")}</span></button>`).join("");$("#modal").innerHTML=`<div class="m-head"><div class="m-icon" style="background:${grad(g.c)}">${g.emoji}</div><div><h2>${esc(L(g.name))}</h2><p>${esc(g.dev)} · ${catName(g.cat)}</p><p>⭐ ${g.rating}</p></div><button class="close" data-close>✕</button></div><div class="m-body"><div class="facts"><div class="fact"><b>${fmtDl(g.dl)}</b><small>${t("downloads")}</small></div><div class="fact"><b>${fmtSize(g.size)}</b><small>${t("size")}</small></div><div class="fact"><b>v${g.ver}</b><small>${t("version")}</small></div><div class="fact"><b>${fmtDate(g.date)}</b><small>${t("updated")}</small></div></div>${g.play?`<button class="play-btn" data-play="${g.id}">▶ ${t("playNow")}</button>`:""}<h3 style="margin:16px 0 8px">${t("about")}</h3><p class="desc">${esc(g.desc)}</p><h3 style="margin:16px 0 8px">${t("download")}</h3><div class="dl-list">${dl}</div><p class="note">${t("tip")}</p></div>`;$("#overlay").classList.add("open");document.body.style.overflow="hidden"}
function closeModal(){$("#overlay").classList.remove("open");document.body.style.overflow=""}
function startDownload(key){let [id,p]=key.split(":");let g=GAMES.find(x=>x.id==id);if(g.links&&g.links[p]){window.open(g.links[p],"_blank","noopener");return}toast(t("noLink"))}
function openPlayer(id){let g=GAMES.find(x=>x.id===id);if(!g||!g.play)return;$("#pTitle").textContent=L(g.name);$("#pNew").style.display=g.play==="galaxy"?"none":"";$("#pNew").href=g.play==="f1"?"https://html5games.com/":"https://lichess.org/";$("#pFrame").srcdoc=g.play==="f1"?f1Game():g.play==="galaxy"?galaxyGame():chessGame();$("#playerOverlay").classList.add("open");document.body.style.overflow="hidden";closeModal()}
function closePlayer(){$("#playerOverlay").classList.remove("open");$("#pFrame").srcdoc="";document.body.style.overflow=""}

function chessGame(){return `<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#262421;color:white;font-family:system-ui;text-align:center;margin:0;padding:12px}#board{width:min(94vw,70vh,560px);height:min(94vw,70vh,560px);display:grid;grid-template-columns:repeat(8,1fr);margin:auto;direction:ltr}.sq{display:grid;place-items:center;font-size:clamp(20px,8vw,48px);cursor:pointer;user-select:none}.l{background:#f0d9b5;color:#111}.d{background:#b58863;color:#111}.sel{outline:4px solid #f6f669;outline-offset:-4px}button{padding:9px 14px;margin:10px;border-radius:8px;background:#3a3733;color:white;border:1px solid #666}</style><h2>♟️ الشطرنج — لاعبان</h2><p id="status">دور الأبيض</p><div id="board"></div><button onclick="reset()">لعبة جديدة</button><script>const start=['♜','♞','♝','♛','♚','♝','♞','♜'];let b,sel=null,turn=0;function reset(){b=[start.slice(),Array(8).fill('♟'),...Array.from({length:4},()=>Array(8).fill('')),Array(8).fill('♙'),start.map(x=>({'♜':'♖','♞':'♘','♝':'♗','♛':'♕','♚':'♔'}[x]))];sel=null;turn=0;draw()}function draw(){let el=document.getElementById('board');el.innerHTML='';b.forEach((row,r)=>row.forEach((p,c)=>{let s=document.createElement('div');s.className='sq '+((r+c)%2?'d':'l')+(sel&&sel[0]===r&&sel[1]===c?' sel':'');s.textContent=p;s.onclick=()=>click(r,c);el.appendChild(s)}));document.getElementById('status').textContent=turn%2?'دور الأسود':'دور الأبيض'}function click(r,c){if(sel){if(sel[0]===r&&sel[1]===c){sel=null}else{b[r][c]=b[sel[0]][sel[1]];b[sel[0]][sel[1]]='';if(r===0&&b[r][c]==='♙')b[r][c]='♕';if(r===7&&b[r][c]==='♟')b[r][c]='♛';turn++;sel=null}}else if(b[r][c])sel=[r,c];draw()}reset();<\/script></html>`}
function f1Game(){return `<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center}canvas{display:block;margin:auto;background:#343a40;max-width:100vw;max-height:80vh}button{padding:12px;margin:8px;border:0;border-radius:9px;background:#00d1b2;font-weight:bold}p{margin:8px}</style><h2>🏁 F1 Grand Prix</h2><p>التحكم: الأسهم أو أزرار اللمس</p><canvas id="c" width="420" height="650"></canvas><div><button id="left">⬅️</button><button id="go">تسارع ⬆️</button><button id="right">➡️</button></div><p id="score">النتيجة: 0</p><script>const c=document.getElementById('c'),x=c.getContext('2d');let car=190,score=0,keys={};onkeydown=e=>keys[e.key]=true;onkeyup=e=>keys[e.key]=false;let hold={};['left','right','go'].forEach(id=>{let b=document.getElementById(id);b.ontouchstart=b.onmousedown=()=>hold[id]=true;b.ontouchend=b.onmouseup=b.onmouseleave=()=>hold[id]=false});function loop(){x.fillStyle='#555';x.fillRect(0,0,420,650);x.fillStyle='#287447';x.fillRect(0,0,60,650);x.fillRect(360,0,60,650);x.fillStyle='#eee';for(let y=-30;y<650;y+=90)x.fillRect(207,y+(score%90),6,45);if(keys.ArrowLeft||hold.left)car-=5;if(keys.ArrowRight||hold.right)car+=5;car=Math.max(70,Math.min(310,car));if(keys.ArrowUp||hold.go)score+=2;score++;x.fillStyle='#e10600';x.fillRect(car,520,38,70);x.fillStyle='#111';x.fillRect(car+5,530,8,16);x.fillRect(car+25,530,8,16);x.fillStyle='#fff';x.fillRect(car+7,540,24,12);document.getElementById('score').textContent='النتيجة: '+Math.floor(score/10);requestAnimationFrame(loop)}loop();<\/script></html>`}
document.addEventListener("click",e=>{let x=e.target,f=x.closest("[data-fav]");if(f){let id=+f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);try{localStorage.setItem("fph_favs",JSON.stringify([...favs]))}catch(_){}renderGrid();return}let dl=x.closest("[data-dl]");if(dl){startDownload(dl.dataset.dl);return}let pl=x.closest("[data-play]");if(pl){e.stopPropagation();openPlayer(+pl.dataset.play);return}if(x.closest("[data-close]")||x===$("#overlay")){closeModal();return}if(x.closest("#pClose")){closePlayer();return}let card=x.closest(".card");if(card){openGame(+card.dataset.id);return}let p=x.closest("[data-plat]");if(p){state.plat=p.dataset.plat;renderFilters();renderGrid();return}let c=x.closest("[data-cat]");if(c){state.cat=c.dataset.cat;renderFilters();renderGrid();return}let v=x.closest("[data-view]");if(v){state.view=v.dataset.view;document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b===v));renderGrid()}});
